<section
  class="flex flex-col items-center justify-center min-h-screen py-24 px-4 lg:px-12 animate-fade-in w-full max-w-[1400px] mx-auto">

  <header class="w-full mb-12 flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h2 class="text-sm font-bold text-fuchsia-400 uppercase tracking-widest mb-2">Work</h2>
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-black text-white tracking-tight uppercase">Personal &
        professional projects</h1>
    </div>
    <div class="h-px bg-white/10 flex-grow hidden md:block mx-8 mb-4"></div>
  </header>

  <div class="flex flex-col lg:flex-row w-full gap-8">

    <!-- Left Column: Project List -->
    <div class="w-full lg:w-1/3 flex flex-col gap-4">
      @for (project of projects; track project.id) {
      <button (click)="setActiveProject(project)"
        class="group text-left p-6 rounded-2xl border transition-all duration-300 relative overflow-hidden"
        [ngClass]="activeProject()?.id === project.id ? 'bg-[#131318] border-white/10 shadow-lg' : 'bg-transparent border-transparent hover:bg-white/5'">

        <div class="flex items-start gap-4">
          <span class="text-sm font-mono mt-1 transition-colors"
            [ngClass]="activeProject()?.id === project.id ? 'text-fuchsia-500' : 'text-slate-600 group-hover:text-slate-400'">
            0{{$index + 1}}
          </span>
          <div class="flex flex-col">
            <h3 class="text-xl font-bold transition-colors"
              [ngClass]="activeProject()?.id === project.id ? 'text-white' : 'text-slate-400 group-hover:text-white'">
              {{ project.title }}
            </h3>
            <p class="text-sm mt-2 transition-colors"
              [ngClass]="activeProject()?.id === project.id ? 'text-slate-400' : 'text-slate-600 group-hover:text-slate-500'">
              {{ project.description }}
            </p>
          </div>
        </div>

        @if (activeProject()?.id === project.id) {
        <div class="absolute inset-y-0 left-0 w-1 bg-fuchsia-500 rounded-r-full"></div>
        }
      </button>
      }
    </div>

    <!-- Right Column: Project Details -->
    <div class="w-full lg:w-2/3">
      @if (activeProject()) {
      <div class="sticky top-24">
        <app-project [project]="activeProject()!" />
      </div>
      }
    </div>

  </div>

</section>
