<div class="relative flex flex-col items-center justify-center min-h-screen px-6 py-20 overflow-hidden text-center">

  <div class="z-10 flex flex-col items-center mt-10 md:mt-20 animate-fade-in">
    <div class="text-fuchsia-400 font-mono text-xs md:text-sm tracking-widest uppercase mb-6 flex items-center">
      Primary Stack: Angular • Spring Boot<span class="ml-1 inline-block w-1.5 h-4 bg-fuchsia-400 animate-pulse"></span>
    </div>

    <h1 class="text-5xl md:text-7xl lg:text-[6rem] font-black text-white tracking-tight mb-4 flex items-center justify-center gap-4">
      Charles Crane
      <img src="/favicon.ico" class="w-12 h-12 md:w-16 md:h-16 rounded-full border border-white/10 hidden md:block">
    </h1>
    
    <h2 class="text-xl md:text-3xl font-medium text-slate-300 mb-8 flex items-center justify-center gap-3">
      <span class="text-fuchsia-500 font-mono">&gt;</span> Full-Stack Developer
    </h2>

    <p class="text-base md:text-lg text-slate-400 max-w-2xl leading-relaxed mb-12">
        I build robust backend systems, design clean interfaces, and deploy cloud infrastructure. 
        Focused on <span class="text-slate-200">Java</span>, <span class="text-slate-200">Spring Boot</span>, <span class="text-slate-200">Angular</span>, and <span class="text-slate-200">AWS</span>.
    </p>

    <div class="flex items-center gap-6">
      <a target="_blank" href="https://github.com/ChxrlieExe33"
         class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center text-slate-400 hover:text-white hover:border-fuchsia-500/50 hover:bg-fuchsia-500/10 transition-all duration-300">
        <fa-icon [icon]="faGithub" size="lg"></fa-icon>
      </a>
      <a target="_blank" href="https://www.linkedin.com/in/charlesdavidcrane/"
         class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center text-slate-400 hover:text-white hover:border-fuchsia-500/50 hover:bg-fuchsia-500/10 transition-all duration-300">
        <fa-icon [icon]="faLinkedin" size="lg"></fa-icon>
      </a>
      <a target="_blank" href="https://x.com/cc_pwnn"
         class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center text-slate-400 hover:text-white hover:border-fuchsia-500/50 hover:bg-fuchsia-500/10 transition-all duration-300">
        <fa-icon [icon]="faX" size="lg"></fa-icon>
      </a>
    </div>
  </div>

  <!-- Scroll indicator -->
  <button
    (click)="scrollToNext()"
    class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10 flex flex-col items-center gap-2 group cursor-pointer bg-transparent border-none outline-none"
    aria-label="Scroll to next section">
    <span class="text-[11px] font-mono uppercase tracking-[0.2em] text-slate-500 group-hover:text-fuchsia-400 transition-colors duration-300">Scroll</span>
    <span class="scroll-arrow w-10 h-10 rounded-full border border-white/10 flex items-center justify-center text-slate-500 group-hover:text-fuchsia-400 group-hover:border-fuchsia-500/40 group-hover:bg-fuchsia-500/5 transition-all duration-300">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </button>
</div>
